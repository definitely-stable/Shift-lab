name: DELSK-012 S4 evaluate

# No natural payload is acquired here. This workflow verifies retained shard
# evidence and invokes the immutable S4 evaluator from PR #52's merge commit.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA shared by all selected shard runs
        type: string
        required: true
      shard_run_ids:
        description: Comma-separated 16 successful first-attempt S4 shard run IDs
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: delsk-s4-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SHARD_RUN_IDS: ${{ inputs.shard_run_ids }}
      PROTOCOL_SHA: ea35f16a0f52cd7c41df2763f0bd2794fbbdb476
      CHUNKSHIFT_SHA: 74bb301b6d8ecc52cf0bc0e00d86fa174093d91b

    steps:
      - name: Checkout S4 implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind evaluation to exact main implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$SOURCE_SHA" = "$GITHUB_SHA"

      - name: Checkout immutable S4 protocol authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: definitely-stable/Shift-lab
          ref: ea35f16a0f52cd7c41df2763f0bd2794fbbdb476
          path: protocol
          persist-credentials: false

      - name: Rebuild exact authority plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C protocol rev-parse HEAD)" = "$PROTOCOL_SHA"
          (
            cd protocol
            python3 .work/tools/selector_s4.py plan "$RUNNER_TEMP/s4-plan.json"
          )

      - name: Validate selected shard run IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SHARD_RUN_IDS" "$RUNNER_TEMP/run-ids.txt" <<'PY'
          import re
          import sys

          raw, out = sys.argv[1:]
          ids = [part.strip() for part in raw.split(",") if part.strip()]
          if len(ids) != 16 or len(set(ids)) != 16 or any(not re.fullmatch(r"[1-9][0-9]*", item) for item in ids):
              raise SystemExit("exactly 16 unique positive shard run IDs are required")
          open(out, "w", encoding="utf-8").write("\n".join(ids) + "\n")
          PY

      - name: Download and verify GitHub shard artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shards"
          : > "$RUNNER_TEMP/artifact-index.jsonl"

          while read -r run_id
          do
            run_json="$RUNNER_TEMP/run-$run_id.json"
            artifacts_json="$RUNNER_TEMP/artifacts-$run_id.json"
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$run_json"
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$artifacts_json"

            mapfile -t meta < <(
              python3 - "$run_json" "$artifacts_json" "$SOURCE_SHA" "$run_id" "$RUNNER_TEMP/artifact-index.jsonl" <<'PY'
          import json
          import re
          import sys

          run_path, artifacts_path, source_sha, expected_run_id, index_path = sys.argv[1:]
          run = json.load(open(run_path, encoding="utf-8"))
          expected_run_id = int(expected_run_id)
          checks = {
              "id": run.get("id") == expected_run_id,
              "event": run.get("event") == "workflow_dispatch",
              "status": run.get("status") == "completed",
              "conclusion": run.get("conclusion") == "success",
              "attempt": run.get("run_attempt") == 1,
              "branch": run.get("head_branch") == "main",
              "head": run.get("head_sha") == source_sha,
              "workflow": run.get("path") == ".github/workflows/selector-s4-shard.yml",
          }
          failed = [key for key, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f"run {expected_run_id} contract mismatch: {', '.join(failed)}")

          artifacts = json.load(open(artifacts_path, encoding="utf-8")).get("artifacts", [])
          matches = [
              item for item in artifacts
              if re.fullmatch(rf"delsk-s4-shard-[0-9]+-of-16-{expected_run_id}-1", str(item.get("name") or ""))
          ]
          if len(matches) != 1:
              raise SystemExit(f"run {expected_run_id}: expected exactly one S4 shard artifact")
          artifact = matches[0]
          digest = str(artifact.get("digest") or "").lower()
          if artifact.get("expired") is not False:
              raise SystemExit(f"run {expected_run_id}: artifact is expired")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"run {expected_run_id}: artifact has no valid SHA-256 digest")
          aid, size = artifact.get("id"), artifact.get("size_in_bytes")
          if not isinstance(aid, int) or aid <= 0 or not isinstance(size, int) or size <= 0:
              raise SystemExit(f"run {expected_run_id}: invalid artifact metadata")

          row = {
              "run_id": expected_run_id,
              "run_attempt": 1,
              "head_sha": source_sha,
              "workflow_path": ".github/workflows/selector-s4-shard.yml",
              "artifact_id": aid,
              "artifact_name": artifact["name"],
              "artifact_digest": digest,
              "artifact_size": size,
          }
          with open(index_path, "a", encoding="utf-8") as stream:
              stream.write(json.dumps(row, sort_keys=True, separators=(",", ":")) + "\n")
          print(aid)
          print(digest)
          PY
            )

            artifact_id="${meta[0]}"
            artifact_digest="${meta[1]}"
            zip="$RUNNER_TEMP/artifact-$run_id.zip"
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$zip"

            actual="sha256:$(sha256sum "$zip" | cut -d' ' -f1)"
            test "$actual" = "$artifact_digest"

            mkdir -p "$RUNNER_TEMP/shards/run-$run_id"
            unzip -q "$zip" -d "$RUNNER_TEMP/shards/run-$run_id"
          done < "$RUNNER_TEMP/run-ids.txt"

      - name: Merge exact shard evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .work/tools/selector_s4_collect.py merge             "$RUNNER_TEMP/s4-plan.json"             "$RUNNER_TEMP/artifact-index.jsonl"             "$RUNNER_TEMP/shards"             "$RUNNER_TEMP/combined"

      - name: Evaluate with immutable protocol authority
        shell: bash
        run: |
          set -euo pipefail
          (
            cd protocol
            python3 .work/tools/selector_s4.py evaluate               "$RUNNER_TEMP/s4-plan.json"               "$RUNNER_TEMP/combined/measurements.jsonl"               "$RUNNER_TEMP/combined/result.json"
          )

      - name: Retain evaluation provenance
        shell: bash
        run: |
          cp "$RUNNER_TEMP/artifact-index.jsonl" "$RUNNER_TEMP/combined/artifact-index.jsonl"
          python3 - "$RUNNER_TEMP/combined/evaluation-run.json" <<'PY'
          import json
          import os
          import sys

          keys = (
              "GITHUB_SHA", "GITHUB_WORKFLOW_SHA", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "GITHUB_REF", "RUNNER_OS", "RUNNER_ARCH",
              "ImageOS", "ImageVersion",
          )
          out = {
              "schema": "delsk.chunkshift-s4.evaluation-run.v1",
              "protocol_authority": os.environ["PROTOCOL_SHA"],
              "implementation_sha": os.environ["SOURCE_SHA"],
              "chunkshift_commit": os.environ["CHUNKSHIFT_SHA"],
              **{key.lower(): os.environ.get(key) for key in keys},
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(out, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

      - name: Artifact cap before upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .work/tools/budget.py artifact-check "$RUNNER_TEMP/combined"

      - name: Upload combined S4 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delsk-s4-evaluation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/combined
          retention-days: 30
          if-no-files-found: error
