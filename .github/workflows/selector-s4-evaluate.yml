name: DELSK-012 S4 evaluate
run-name: S4 evaluate · ${{ inputs.batch_id || 'manual' }}

# No natural payload is acquired here. This workflow verifies retained shard
# evidence and invokes the immutable S4 evaluator from PR #52's merge commit.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full main commit SHA shared by all selected shard runs
        type: string
        required: true
      shard_run_ids:
        description: Comma-separated 16 successful first-attempt S4 shard run IDs
        type: string
        required: true
      cost_run_id:
        description: Successful first-attempt S4 selector-cost run ID
        type: string
        required: true
      batch_id:
        description: Optional automatic-chain identity; must equal source_sha
        type: string
        required: false
        default: ""

permissions:
  contents: read
  actions: read

concurrency:
  group: delsk-s4-evaluate
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      SHARD_RUN_IDS: ${{ inputs.shard_run_ids }}
      COST_RUN_ID: ${{ inputs.cost_run_id }}
      BATCH_ID: ${{ inputs.batch_id }}
      PROTOCOL_SHA: ea35f16a0f52cd7c41df2763f0bd2794fbbdb476
      CHUNKSHIFT_SHA: 74bb301b6d8ecc52cf0bc0e00d86fa174093d91b

    steps:
      - name: Checkout S4 implementation
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Bind evaluation to exact main implementation
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/main"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"
          if [ -n "$BATCH_ID" ]; then
            test "$BATCH_ID" = "$SOURCE_SHA"
          fi

      - name: Checkout immutable S4 protocol authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: definitely-stable/Shift-lab
          ref: ea35f16a0f52cd7c41df2763f0bd2794fbbdb476
          path: protocol
          persist-credentials: false

      - name: Rebuild exact authority plan
        shell: bash
        run: |
          set -euo pipefail
          test "$(git -C protocol rev-parse HEAD)" = "$PROTOCOL_SHA"
          (
            cd protocol
            python3 .work/tools/selector_s4.py plan "$RUNNER_TEMP/s4-plan.json"
          )

      - name: Validate selected shard run IDs
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$SHARD_RUN_IDS" "$RUNNER_TEMP/run-ids.txt" <<'PY'
          import re
          import sys

          raw, out = sys.argv[1:]
          ids = [part.strip() for part in raw.split(",") if part.strip()]
          if len(ids) != 16 or len(set(ids)) != 16 or any(not re.fullmatch(r"[1-9][0-9]*", item) for item in ids):
              raise SystemExit("exactly 16 unique positive shard run IDs are required")
          open(out, "w", encoding="utf-8").write("\n".join(ids) + "\n")
          PY

      - name: Wait for selected S4 runs to finalize
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          { cat "$RUNNER_TEMP/run-ids.txt"; printf '%s\n' "$COST_RUN_ID"; } |
          while read -r run_id
          do
            completed=false
            for _ in $(seq 1 30)
            do
              status="$(gh api \
                -H "Accept: application/vnd.github+json" \
                -H "X-GitHub-Api-Version: 2022-11-28" \
                "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" \
                --jq '.status')"
              if [ "$status" = completed ]; then
                completed=true
                break
              fi
              sleep 2
            done
            test "$completed" = true
          done
      - name: Download and verify GitHub shard artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/shards"
          : > "$RUNNER_TEMP/artifact-index.jsonl"

          while read -r run_id
          do
            run_json="$RUNNER_TEMP/run-$run_id.json"
            artifacts_json="$RUNNER_TEMP/artifacts-$run_id.json"
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id" > "$run_json"
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts?per_page=100" > "$artifacts_json"

            mapfile -t meta < <(
              python3 - "$run_json" "$artifacts_json" "$SOURCE_SHA" "$run_id" "$RUNNER_TEMP/artifact-index.jsonl" <<'PY'
          import json
          import re
          import sys

          run_path, artifacts_path, source_sha, expected_run_id, index_path = sys.argv[1:]
          run = json.load(open(run_path, encoding="utf-8"))
          expected_run_id = int(expected_run_id)
          checks = {
              "id": run.get("id") == expected_run_id,
              "event": run.get("event") == "workflow_dispatch",
              "status": run.get("status") == "completed",
              "conclusion": run.get("conclusion") == "success",
              "attempt": run.get("run_attempt") == 1,
              "branch": run.get("head_branch") == "main",
              "head": run.get("head_sha") == source_sha,
              "workflow": run.get("path") == ".github/workflows/selector-s4-shard.yml",
          }
          failed = [key for key, ok in checks.items() if not ok]
          if failed:
              raise SystemExit(f"run {expected_run_id} contract mismatch: {', '.join(failed)}")

          artifacts = json.load(open(artifacts_path, encoding="utf-8")).get("artifacts", [])
          matches = [
              item for item in artifacts
              if re.fullmatch(rf"delsk-s4-shard-[0-9]+-of-16-{expected_run_id}-1", str(item.get("name") or ""))
          ]
          if len(matches) != 1:
              raise SystemExit(f"run {expected_run_id}: expected exactly one S4 shard artifact")
          artifact = matches[0]
          digest = str(artifact.get("digest") or "").lower()
          if artifact.get("expired") is not False:
              raise SystemExit(f"run {expected_run_id}: artifact is expired")
          if not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit(f"run {expected_run_id}: artifact has no valid SHA-256 digest")
          aid, size = artifact.get("id"), artifact.get("size_in_bytes")
          if not isinstance(aid, int) or aid <= 0 or not isinstance(size, int) or size <= 0:
              raise SystemExit(f"run {expected_run_id}: invalid artifact metadata")

          row = {
              "run_id": expected_run_id,
              "run_attempt": 1,
              "event": run.get("event"),
              "status": run.get("status"),
              "conclusion": run.get("conclusion"),
              "head_branch": run.get("head_branch"),
              "head_sha": source_sha,
              "workflow_path": ".github/workflows/selector-s4-shard.yml",
              "artifact_id": aid,
              "artifact_name": artifact["name"],
              "artifact_digest": digest,
              "artifact_size": size,
          }
          with open(index_path, "a", encoding="utf-8") as stream:
              stream.write(json.dumps(row, sort_keys=True, separators=(",", ":")) + "\n")
          print(aid)
          print(digest)
          PY
            )

            artifact_id="${meta[0]}"
            artifact_digest="${meta[1]}"
            zip="$RUNNER_TEMP/artifact-$run_id.zip"
            gh api               -H "Accept: application/vnd.github+json"               -H "X-GitHub-Api-Version: 2022-11-28"               "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$zip"

            actual="sha256:$(sha256sum "$zip" | cut -d' ' -f1)"
            test "$actual" = "$artifact_digest"

            mkdir -p "$RUNNER_TEMP/shards/run-$run_id"
            unzip -q "$zip" -d "$RUNNER_TEMP/shards/run-$run_id"
          done < "$RUNNER_TEMP/run-ids.txt"

      - name: Download and verify selector-cost artifact
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "$COST_RUN_ID" <<'PY'
          import re
          import sys
          if not re.fullmatch(r"[1-9][0-9]*", sys.argv[1]):
              raise SystemExit("cost_run_id must be a positive integer")
          PY

          run_json="$RUNNER_TEMP/cost-run.json"
          artifacts_json="$RUNNER_TEMP/cost-artifacts.json"
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/$GITHUB_REPOSITORY/actions/runs/$COST_RUN_ID" > "$run_json"
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/$GITHUB_REPOSITORY/actions/runs/$COST_RUN_ID/artifacts?per_page=100" > "$artifacts_json"

          mapfile -t meta < <(
            python3 - "$run_json" "$artifacts_json" "$SOURCE_SHA" "$COST_RUN_ID" <<'PY'
          import json
          import re
          import sys

          run_path, artifacts_path, source_sha, expected_id = sys.argv[1:]
          expected_id = int(expected_id)
          run = json.load(open(run_path, encoding="utf-8"))
          checks = {
              "id": run.get("id") == expected_id,
              "event": run.get("event") == "workflow_dispatch",
              "status": run.get("status") == "completed",
              "conclusion": run.get("conclusion") == "success",
              "attempt": run.get("run_attempt") == 1,
              "branch": run.get("head_branch") == "main",
              "head": run.get("head_sha") == source_sha,
              "workflow": run.get("path") == ".github/workflows/selector-s4-cost.yml",
          }
          failed = [key for key, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("cost run contract mismatch: " + ", ".join(failed))

          artifacts = json.load(open(artifacts_path, encoding="utf-8")).get("artifacts", [])
          expected_name = f"delsk-s4-cost-{source_sha}-{expected_id}-1"
          matches = [a for a in artifacts if a.get("name") == expected_name]
          if len(matches) != 1:
              raise SystemExit("expected exactly one selector-cost artifact")
          artifact = matches[0]
          digest = str(artifact.get("digest") or "").lower()
          if artifact.get("expired") is not False or not re.fullmatch(r"sha256:[0-9a-f]{64}", digest):
              raise SystemExit("selector-cost artifact is expired or lacks a valid digest")
          aid, size = artifact.get("id"), artifact.get("size_in_bytes")
          if not isinstance(aid, int) or aid <= 0 or not isinstance(size, int) or size <= 0:
              raise SystemExit("selector-cost artifact metadata is invalid")
          print(aid)
          print(digest)
          print(size)
          PY
          )

          cost_artifact_id="${meta[0]}"
          cost_artifact_digest="${meta[1]}"
          cost_artifact_size="${meta[2]}"
          cost_zip="$RUNNER_TEMP/cost-artifact.zip"
          gh api             -H "Accept: application/vnd.github+json"             -H "X-GitHub-Api-Version: 2022-11-28"             "/repos/$GITHUB_REPOSITORY/actions/artifacts/$cost_artifact_id/zip" > "$cost_zip"
          test "sha256:$(sha256sum "$cost_zip" | cut -d' ' -f1)" = "$cost_artifact_digest"

          mkdir -p "$RUNNER_TEMP/cost"
          unzip -q "$cost_zip" -d "$RUNNER_TEMP/cost"
          python3 -             "$RUNNER_TEMP/cost/selector-cost.json"             "$RUNNER_TEMP/cost/admission.json"             "$SOURCE_SHA" "$PROTOCOL_SHA"             "$COST_RUN_ID" "$cost_artifact_id" "$cost_artifact_digest" "$cost_artifact_size"             "$RUNNER_TEMP/cost-artifact.json" <<'PY'
          import json
          import sys

          cost_path, admission_path, source_sha, protocol_sha, run_id, artifact_id, digest, size, out = sys.argv[1:]
          cost = json.load(open(cost_path, encoding="utf-8"))
          admission = json.load(open(admission_path, encoding="utf-8"))
          checks = {
              "schema": cost.get("schema") == "delsk.chunkshift-s4.selector-cost.v1",
              "protocol": cost.get("protocol_authority") == protocol_sha,
              "implementation": cost.get("implementation_sha") == source_sha,
              "selector": cost.get("selector") == "delsk.simple-selector.v1",
              "descriptive": cost.get("decision_endpoint") is False,
              "artifact_head": cost.get("runner", {}).get("github_sha") == source_sha,
              "artifact_workflow": cost.get("runner", {}).get("github_workflow_sha") == source_sha,
              "artifact_ref": cost.get("runner", {}).get("github_ref") == "refs/heads/main",
              "artifact_attempt": str(cost.get("runner", {}).get("github_run_attempt")) == "1",
              "artifact_run": str(cost.get("runner", {}).get("github_run_id")) == run_id,
              "admitted": admission.get("schema") == "delsk.ci.admission.v1" and admission.get("admitted") is True,
          }
          failed = [key for key, ok in checks.items() if not ok]
          if failed:
              raise SystemExit("selector-cost evidence mismatch: " + ", ".join(failed))
          with open(out, "w", encoding="utf-8") as stream:
              json.dump({
                  "schema": "delsk.chunkshift-s4.cost-artifact.v1",
                  "run_id": int(run_id),
                  "run_attempt": 1,
                  "event": "workflow_dispatch",
                  "status": "completed",
                  "conclusion": "success",
                  "head_branch": "main",
                  "head_sha": source_sha,
                  "workflow_path": ".github/workflows/selector-s4-cost.yml",
                  "artifact_id": int(artifact_id),
                  "artifact_digest": digest,
                  "artifact_size": int(size),
                  "implementation_sha": source_sha,
              }, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

      - name: Merge exact shard evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 .work/tools/selector_s4_collect.py merge             "$RUNNER_TEMP/s4-plan.json"             "$RUNNER_TEMP/artifact-index.jsonl"             "$RUNNER_TEMP/shards"             "$RUNNER_TEMP/combined"

      - name: Evaluate with immutable protocol authority
        shell: bash
        run: |
          set -euo pipefail
          (
            cd protocol
            python3 .work/tools/selector_s4.py evaluate               "$RUNNER_TEMP/s4-plan.json"               "$RUNNER_TEMP/combined/measurements.jsonl"               "$RUNNER_TEMP/combined/result.json"
          )

      - name: Retain evaluation provenance
        shell: bash
        run: |
          cp "$RUNNER_TEMP/artifact-index.jsonl" "$RUNNER_TEMP/combined/artifact-index.jsonl"
          cp "$RUNNER_TEMP/cost/selector-cost.json" "$RUNNER_TEMP/combined/selector-cost.json"
          cp "$RUNNER_TEMP/cost-artifact.json" "$RUNNER_TEMP/combined/cost-artifact.json"
          python3 - "$RUNNER_TEMP/combined/evaluation-run.json" <<'PY'
          import json
          import os
          import sys

          keys = (
              "GITHUB_SHA", "GITHUB_WORKFLOW_SHA", "GITHUB_RUN_ID",
              "GITHUB_RUN_ATTEMPT", "GITHUB_REF", "RUNNER_OS", "RUNNER_ARCH",
              "ImageOS", "ImageVersion",
          )
          out = {
              "schema": "delsk.chunkshift-s4.evaluation-run.v1",
              "protocol_authority": os.environ["PROTOCOL_SHA"],
              "implementation_sha": os.environ["SOURCE_SHA"],
              "chunkshift_commit": os.environ["CHUNKSHIFT_SHA"],
              "batch_id": os.environ.get("BATCH_ID") or None,
              **{key.lower(): os.environ.get(key) for key in keys},
          }
          with open(sys.argv[1], "w", encoding="utf-8") as stream:
              json.dump(out, stream, indent=2, sort_keys=True)
              stream.write("\n")
          PY

      - name: Artifact cap before upload
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .work/tools/budget.py artifact-check "$RUNNER_TEMP/combined"

      - name: Upload combined S4 evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: delsk-s4-evaluation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/combined
          retention-days: 30
          if-no-files-found: error
