name: Simple selector S4 ChunkShift screen (experimental)

# DELSK-012 S4-D. The protocol/evaluator are frozen at PR #52 merge
# ea35f16a0f52cd7c41df2763f0bd2794fbbdb476. This workflow is implementation only:
# materialize pinned bytes, invoke pinned ChunkShift public CLI, retain exact measurements,
# then evaluate using the separate frozen protocol checkout.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full current main SHA; must equal the dispatched workflow head
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: delsk-experimental
  cancel-in-progress: false
  queue: max

jobs:
  s4:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
      S4_AUTHORITY: ea35f16a0f52cd7c41df2763f0bd2794fbbdb476
      CHUNKSHIFT_SHA: 74bb301b6d8ecc52cf0bc0e00d86fa174093d91b
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Dispatch must be current main
        run: |
          test "$GITHUB_REF" = "refs/heads/main"
          test "$SOURCE_SHA" = "$GITHUB_SHA"
          test "$GITHUB_WORKFLOW_SHA" = "$GITHUB_SHA"

      - name: Admission (runner-minute ledger, artifact cap)
        id: admit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUDGET_MODE: ${{ vars.DELSK_BUDGET_MODE }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 .work/tools/budget.py admit "$RUNNER_TEMP/evidence/admission.json"

      - name: Admission must pass
        run: test "${{ steps.admit.outcome }}" = success

      - name: Checkout frozen S4 protocol authority
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: definitely-stable/Shift-lab
          ref: ea35f16a0f52cd7c41df2763f0bd2794fbbdb476
          path: protocol
          persist-credentials: false

      - name: Checkout pinned ChunkShift consumer
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: definitely-stable/ChunkShift
          ref: 74bb301b6d8ecc52cf0bc0e00d86fa174093d91b
          path: chunkshift
          persist-credentials: false

      - name: Verify immutable authorities and build frozen plan
        run: |
          test "$(git -C protocol rev-parse HEAD)" = "$S4_AUTHORITY"
          test "$(git -C chunkshift rev-parse HEAD)" = "$CHUNKSHIFT_SHA"
          python3 protocol/.work/tools/selector_s4.py plan "$RUNNER_TEMP/evidence/plan.json"

      - name: Materialize pinned pilot objects
        run: |
          python3 protocol/.work/tools/baselines.py materialize "$RUNNER_TEMP/pilot-store"             | tee "$RUNNER_TEMP/evidence/pilot-materialization.json"

      - name: Materialize pinned X0 objects
        run: |
          mkdir -p "$RUNNER_TEMP/x0-evidence"
          python3 protocol/.work/tools/x0_corpus.py build "$RUNNER_TEMP/x0-store" "$RUNNER_TEMP/x0-evidence"             | tee "$RUNNER_TEMP/evidence/x0-materialization.log"

      - name: Build pinned ChunkShift CLI
        run: |
          dotnet --version
          dotnet build chunkshift/src/ChunkShift.Cli/ChunkShift.Cli.csproj -c Release --nologo
          test -f chunkshift/src/ChunkShift.Cli/bin/Release/net10.0/ChunkShift.Cli.dll

      - name: Measure exact S4 pair universe
        id: measure
        continue-on-error: true
        run: |
          python3 .work/tools/selector_s4_run.py measure             "$RUNNER_TEMP/evidence/plan.json"             "$GITHUB_WORKSPACE/protocol"             "$RUNNER_TEMP/pilot-store"             "$RUNNER_TEMP/x0-store"             "$RUNNER_TEMP/x0-evidence"             "$GITHUB_WORKSPACE/chunkshift"             "$GITHUB_WORKSPACE/chunkshift/src/ChunkShift.Cli/bin/Release/net10.0/ChunkShift.Cli.dll"             "$RUNNER_TEMP/evidence"

      - name: Evaluate with frozen S4 authority
        id: evaluate
        if: steps.measure.outcome == 'success'
        continue-on-error: true
        run: |
          python3 protocol/.work/tools/selector_s4.py evaluate             "$RUNNER_TEMP/evidence/plan.json"             "$RUNNER_TEMP/evidence/measurements.jsonl"             "$RUNNER_TEMP/evidence/result.json"
          cat "$RUNNER_TEMP/evidence/result.json"

      - name: Artifact cap before upload
        id: artifact_cap
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .work/tools/budget.py artifact-check "$RUNNER_TEMP/evidence"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.artifact_cap.outcome == 'success'
        with:
          name: delsk-selector-s4-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error

      - name: S4 run must be complete
        if: always()
        run: |
          test "${{ steps.measure.outcome }}" = success
          test "${{ steps.evaluate.outcome }}" = success
          test "${{ steps.artifact_cap.outcome }}" = success
