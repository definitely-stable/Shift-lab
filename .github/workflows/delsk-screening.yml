name: DELSK-002 X0 screening (experimental)

# DELSK-002 X0 (.work/corpus/x0/README.md): exploratory screening of hard corpus classes. Acquisition of the X0
# roster, file and CDC objects, C_t, exhaustive oracle under the pinned codec lock, cheap baselines and the
# preregistered decision. Not oracle contract v4 and not G1 evidence; payload stays in RUNNER_TEMP. Admission before
# compute, one bounded job, artifact cap before upload. Standard GitHub-hosted runner.
on:
  workflow_dispatch:
    inputs:
      source_sha:
        description: Full commit SHA that must equal the dispatched ref head
        type: string
        required: true

permissions:
  contents: read
  actions: read

# One experimental run at a time across all experimental workflows (budget.EXPERIMENTAL_WORKFLOWS).
concurrency:
  group: delsk-experimental
  cancel-in-progress: false
  queue: max

jobs:
  screening:
    runs-on: ubuntu-24.04
    # Must not exceed budget.RUN_RESERVATION_MINUTES: the admission reserves that cap for every experimental run.
    timeout-minutes: 30
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Source must be the dispatched head
        run: test "$SOURCE_SHA" = "$GITHUB_SHA"
      - name: Admission (runner-minute ledger, artifact cap)
        id: admit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          BUDGET_MODE: ${{ vars.DELSK_BUDGET_MODE }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 .work/tools/budget.py admit "$RUNNER_TEMP/evidence/admission.json"
      - name: Admission must pass
        run: test "${{ steps.admit.outcome }}" = success
      - name: Build the pinned codecs
        run: python3 .work/tools/oracle_build.py "$RUNNER_TEMP/tools"
      - name: Acquire, materialize and build C_t
        run: python3 .work/tools/x0_corpus.py build "$RUNNER_TEMP/store" "$RUNNER_TEMP/evidence"
      - name: Oracle (every pair of every measured query)
        run: python3 .work/tools/x0_screen.py measure "$RUNNER_TEMP/tools" "$RUNNER_TEMP/store" "$RUNNER_TEMP/evidence"
      - name: Baseline rankings
        run: python3 .work/tools/x0_screen.py rank "$RUNNER_TEMP/store" "$RUNNER_TEMP/evidence"
      - name: Evaluation and preregistered decision
        run: python3 .work/tools/x0_screen.py evaluate "$RUNNER_TEMP/evidence"
      - name: Run record
        if: always()
        run: |
          python3 - "$RUNNER_TEMP/evidence/run.json" <<'PY'
          import json, os, sys
          keys = ("GITHUB_SHA", "GITHUB_WORKFLOW_SHA", "GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_REF",
                  "RUNNER_OS", "RUNNER_ARCH", "ImageOS", "ImageVersion")
          json.dump({"schema": "delsk.x0.run.v1", "label": "SCREENING", **{k.lower(): os.environ.get(k) for k in keys}},
                    open(sys.argv[1], "w"), indent=2, sort_keys=True)
          PY
      - name: Artifact cap before upload
        id: artifact_cap
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .work/tools/budget.py artifact-check "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.artifact_cap.outcome == 'success'
        with:
          name: delsk-screening-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error
