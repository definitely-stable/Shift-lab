name: Simple selector parity

# delsk.simple-selector.v1 (.work/selector/README.md): the Rust prototype must order bases exactly like the Python
# reference (.work/selector/vectors.txt). PR and push check, outside the experimental budget.
on:
  pull_request:
    paths:
      - ".work/selector/**"
      - ".work/tools/simple_selector.py"
      - ".github/workflows/selector-ci.yml"
  push:
    branches: [main]
    paths:
      - ".work/selector/**"
      - ".work/tools/simple_selector.py"
      - ".github/workflows/selector-ci.yml"

permissions:
  contents: read

concurrency:
  group: selector-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  parity:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Vectors are reproduced by the Python reference
        run: |
          python3 .work/tools/simple_selector.py vectors "$RUNNER_TEMP/vectors.txt"
          cmp "$RUNNER_TEMP/vectors.txt" .work/selector/vectors.txt
      - name: Rust tests (parity, streaming, top-K)
        working-directory: .work/selector/rust
        run: |
          cargo --version
          cargo test --release --locked
          cargo build --release --locked --bin delsk-confirm
      - name: H11-B0 deterministic synthetic correctness smoke (non-decision)
        working-directory: .work/selector/rust
        run: |
          cargo run --release --locked --bin delsk-h11b0 -- 256 8 > "$RUNNER_TEMP/h11b0.json"
          python3 - "$RUNNER_TEMP/h11b0.json" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          assert data["schema"] == "delsk.h11b0.synthetic-smoke.v1"
          assert data["scope"] == "SYNTHETIC_ONLY_NOT_DECISION_EVIDENCE"
          assert data["objects"] == 256 and data["target_queries"] == 9
          assert len(data["cases"]) == 9
          assert all(row["queries"] == 9 and
              sum(row[k] for k in ("indexed_exact", "fallback_sparse", "fallback_capped", "fallback_invalid")) == 9
              for row in data["cases"])
          PY
