name: Foundation (experimental)

# DELSK-005 R0 foundation: admission before compute, then one bounded
# allowlisted workload on a frozen commit. Contract: .work/ci-plan.md.
# Dispatch on a branch or tag whose head is source_sha.

on:
  workflow_dispatch:
    inputs:
      workload:
        description: Allowlisted workload
        type: choice
        options: [selftest]
        required: true
      source_sha:
        description: Full commit SHA that must equal the dispatched ref head
        type: string
        required: true

permissions:
  contents: read
  actions: read

# One experimental run at a time across all experimental workflows; nothing is
# cancelled, later dispatches wait in the queue and do their own admission.
concurrency:
  group: delsk-experimental
  cancel-in-progress: false
  queue: max

jobs:
  foundation:
    runs-on: ubuntu-24.04
    # Must equal budget.RUN_RESERVATION_MINUTES (checked by test_foundation).
    timeout-minutes: 30
    env:
      WORKLOAD: ${{ inputs.workload }}
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Admission (runner-minute ledger, artifact cap)
        id: admit
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Unset = warn (telemetry). Set the repository variable to `enforce` for the emergency guardrail.
          BUDGET_MODE: ${{ vars.DELSK_BUDGET_MODE }}
        run: |
          mkdir -p "$RUNNER_TEMP/evidence"
          python3 .work/tools/budget.py admit "$RUNNER_TEMP/evidence/admission.json"
      - name: Bounded workload
        run: python3 .work/tools/foundation_run.py "$RUNNER_TEMP/evidence" "$RUNNER_TEMP/work/data" "$RUNNER_TEMP/evidence/admission.json"
      - name: Artifact cap before upload
        id: artifact_cap
        if: always()
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .work/tools/budget.py artifact-check "$RUNNER_TEMP/evidence"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always() && steps.artifact_cap.outcome == 'success'
        with:
          name: foundation-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/evidence
          retention-days: 30
          if-no-files-found: error
