name: Research documentation

on:
  push:
    paths: ['.work/**', '.github/workflows/research-docs.yml', '.github/workflows/foundation.yml', 'README.md']
  pull_request:
    paths: ['.work/**', '.github/workflows/research-docs.yml', '.github/workflows/foundation.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Validate research package
        run: python3 .work/tools/validate.py
      - name: Test corpus contracts and foundation admission
        run: python3 -m unittest discover -s .work/tests -v
      - name: All-attempts evidence is append-only against the reviewed base
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python3 .work/tools/oracle_attempts.py audit-base "$BASE_SHA"
