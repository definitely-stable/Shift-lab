name: Research documentation

on:
  push:
    paths: ['.work/**', '.github/workflows/research-docs.yml', 'README.md']
  pull_request:
    paths: ['.work/**', '.github/workflows/research-docs.yml', 'README.md']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate research package
        run: python3 .work/tools/validate.py
