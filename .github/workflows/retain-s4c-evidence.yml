name: S4-C immutable evidence archive
on:
  push:
    branches: [research/delsk-s4c-evidence-lock]
    paths:
      - .github/workflows/retain-s4c-evidence.yml
      - .work/tools/retain_s4c_evidence.py

permissions:
  contents: write
  actions: read

concurrency:
  group: delsk-s4c-immutable-archive
  cancel-in-progress: false

jobs:
  archive:
    if: github.repository == 'definitely-stable/Shift-lab'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Checkout research branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - name: Preserve original first-attempt GitHub ZIPs and replay v3
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .work/tools/retain_s4c_evidence.py
      - name: Commit retained original evidence to research PR branch
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = refs/heads/research/delsk-s4c-evidence-lock
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .work/results/SELECTOR-S4C
          test -n "$(git diff --cached --name-only)"
          git commit -m 'evidence(S4-C): preserve original first-attempt artifacts and frozen replay'
          git push origin HEAD:refs/heads/research/delsk-s4c-evidence-lock
